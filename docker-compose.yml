services:
  postgres:
    image: postgres:16-alpine
    container_name: interview-lab-pg
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: interview_lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d interview_lab"]
      interval: 2s
      timeout: 5s
      retries: 10
